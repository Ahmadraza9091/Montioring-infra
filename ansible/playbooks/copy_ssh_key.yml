---
- name: Install the controller SSH public key on NRPE clients
  hosts: nrpe_clients
  become: true
  gather_facts: false
  tasks:
    - name: Authorize the Ansible SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user | default(ansible_remote_user) }}"
        key: "{{ lookup('file', ansible_public_key_path) }}"
        state: present
        manage_dir: true
      no_log: true
