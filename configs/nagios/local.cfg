define host {
    use                     linux-server
    host_name               opsknight-monitoring-host
    alias                   Monitoring host
    address                 127.0.0.1
}

define service {
    use                     local-service
    host_name               opsknight-monitoring-host
    service_description     Current Load
    check_command           check_local_load
}

define service {
    use                     local-service
    host_name               opsknight-monitoring-host
    service_description     Root Disk
    check_command           check_local_disk!20%!10%!/
}
